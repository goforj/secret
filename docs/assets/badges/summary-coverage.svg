<svg xmlns="http://www.w3.org/2000/svg" width="122" height="20" viewBox="0 0 122 20" role="img" aria-label="unit coverage: 100%">
  <title>unit coverage: 100%</title>
  <defs>
    <linearGradient id="shade" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
    <clipPath id="badge"><rect width="122" height="20" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="122" height="20" fill="#555"/>
    <rect x="88" width="34" height="20" fill="#4c1"/>
    <rect width="122" height="20" fill="url(#shade)"/>
  </g>
  <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <g fill="#010101" fill-opacity=".3"><text x="44" y="15">unit coverage</text><text x="105" y="15">100%</text></g>
    <g fill="#fff"><text x="44" y="14">unit coverage</text><text x="105" y="14">100%</text></g>
  </g>
</svg>
