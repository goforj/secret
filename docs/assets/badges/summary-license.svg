<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20" viewBox="0 0 80 20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <defs>
    <linearGradient id="shade" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
    <clipPath id="badge"><rect width="80" height="20" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="80" height="20" fill="#555"/>
    <rect x="52" width="28" height="20" fill="#007ec6"/>
    <rect width="80" height="20" fill="url(#shade)"/>
  </g>
  <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <g fill="#010101" fill-opacity=".3"><text x="26" y="15">license</text><text x="66" y="15">MIT</text></g>
    <g fill="#fff"><text x="26" y="14">license</text><text x="66" y="14">MIT</text></g>
  </g>
</svg>
